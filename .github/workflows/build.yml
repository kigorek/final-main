name: final-main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
    - uses: golangci/golangci-lint-action@v3 

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...      